<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="A real-time multiplayer space game built with Flame and Supabase.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Supaspace">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Supaspace</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background-color: #05060F; }

    /* Loader shown while the app downloads and boots, removed once Flutter
       renders its first frame (the in-game loader then takes over). */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background-color: #05060F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
    }
    #loading .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6px;
      color: #66E0FF;
    }
    #loading .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(102, 224, 255, 0.2);
      border-top-color: #66E0FF;
      border-radius: 50%;
      animation: supaspace-spin 0.9s linear infinite;
    }
    @keyframes supaspace-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="title">SUPASPACE</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Flutter fires this once the first frame is painted; hand off to the
    // in-app loader.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) loader.remove();
    });
  </script>

  <!-- flutter_soloud web runtime (background music / sound effects). -->
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
