name: supaspace
description: >-
  A real-time multiplayer space game built with Flame and Supabase Realtime.
  Fly out, capture the most planets in 5 minutes, and climb a persistent high
  score.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flame: ^1.37.0
  flutter:
    sdk: flutter
  flutter_soloud: ^4.0.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.12.4
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.4.13
  flame_lint: ^1.4.3
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/powerups/
    - assets/sounds/
  shaders:
    - shaders/starfield.frag
